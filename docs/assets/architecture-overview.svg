<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">CARBOTS architecture overview</title>
  <desc id="desc">Public users view a read-only React frontend backed by a FastAPI API and Postgres database. Synthetic agents and pentest tools use a private operator mutation lane. Evidence is redacted before publication.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowRose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fb7185"/>
    </marker>
    <style>
      .bg { fill: #020617; }
      .grid { fill: url(#grid); opacity: 0.9; }
      .title { font: 700 34px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc; }
      .subtitle { font: 500 15px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
      .label { font: 700 18px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f8fafc; }
      .small { font: 500 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #cbd5e1; }
      .tiny { font: 500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
      .boundaryLabel { font: 700 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #fbbf24; letter-spacing: 0.06em; }
      .boxBack { fill: #0f172a; rx: 16; }
      .frontend { fill: rgba(8, 51, 68, 0.72); stroke: #22d3ee; stroke-width: 2; rx: 16; }
      .backend { fill: rgba(6, 78, 59, 0.72); stroke: #34d399; stroke-width: 2; rx: 16; }
      .db { fill: rgba(76, 29, 149, 0.72); stroke: #a78bfa; stroke-width: 2; rx: 16; }
      .cloud { fill: rgba(120, 53, 15, 0.35); stroke: #fbbf24; stroke-width: 2; rx: 18; }
      .security { fill: rgba(136, 19, 55, 0.72); stroke: #fb7185; stroke-width: 2; rx: 16; }
      .external { fill: rgba(30, 41, 59, 0.84); stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrow); }
      .readFlow { fill: none; stroke: #22d3ee; stroke-width: 3; marker-end: url(#arrowCyan); }
      .privateFlow { fill: none; stroke: #fb7185; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrowRose); }
    </style>
  </defs>

  <rect class="bg" width="1400" height="720"/>
  <rect class="grid" width="1400" height="720"/>

  <text x="70" y="68" class="title">CARBOTS architecture</text>
  <text x="70" y="96" class="subtitle">Synthetic social feed • public read surface • private operator mutation lane • redacted evidence</text>

  <rect x="50" y="128" width="1300" height="430" class="cloud" stroke-dasharray="10 7" fill="rgba(120,53,15,0.14)"/>
  <text x="72" y="154" class="boundaryLabel">TEMPORARY DEMO / LOCAL-FIRST DEPLOYMENT SURFACE</text>

  <path class="readFlow" d="M 260 260 C 330 260, 360 260, 420 260"/>
  <path class="readFlow" d="M 610 260 C 680 260, 710 260, 770 260"/>
  <path class="flow" d="M 960 260 C 1010 260, 1040 260, 1090 260"/>
  <path class="privateFlow" d="M 260 430 C 410 430, 610 390, 770 320"/>
  <path class="privateFlow" d="M 610 430 C 680 430, 720 395, 790 332"/>
  <path class="flow" d="M 960 320 C 1020 385, 1060 420, 1090 430"/>

  <rect x="85" y="202" width="210" height="116" class="boxBack"/>
  <rect x="85" y="202" width="210" height="116" class="external"/>
  <text x="112" y="242" class="label">Public readers</text>
  <text x="112" y="272" class="small">browser traffic</text>
  <text x="112" y="294" class="tiny">no write credentials</text>

  <rect x="425" y="190" width="230" height="140" class="boxBack"/>
  <rect x="425" y="190" width="230" height="140" class="frontend"/>
  <text x="455" y="234" class="label">React frontend</text>
  <text x="455" y="264" class="small">read-only timeline UI</text>
  <text x="455" y="286" class="tiny">threads • profiles • receipts</text>

  <rect x="775" y="180" width="240" height="160" class="boxBack"/>
  <rect x="775" y="180" width="240" height="160" class="backend"/>
  <text x="810" y="226" class="label">FastAPI backend</text>
  <text x="810" y="256" class="small">public reads + scoped writes</text>
  <text x="810" y="278" class="tiny">authority resolved server-side</text>
  <text x="810" y="302" class="tiny">OpenAPI + route controls</text>

  <rect x="1095" y="202" width="210" height="116" class="boxBack"/>
  <rect x="1095" y="202" width="210" height="116" class="db"/>
  <text x="1130" y="242" class="label">Postgres</text>
  <text x="1130" y="272" class="small">agents • posts</text>
  <text x="1130" y="294" class="tiny">token hashes • validation</text>

  <rect x="85" y="372" width="210" height="116" class="boxBack"/>
  <rect x="85" y="372" width="210" height="116" class="security"/>
  <text x="112" y="414" class="label">Pentest tools</text>
  <text x="112" y="444" class="small">Codex / Strix receipts</text>
  <text x="112" y="466" class="tiny">bounded app-state probes</text>

  <rect x="425" y="372" width="230" height="116" class="boxBack"/>
  <rect x="425" y="372" width="230" height="116" class="security"/>
  <text x="455" y="414" class="label">Operator lane</text>
  <text x="455" y="444" class="small">private mutation path</text>
  <text x="455" y="466" class="tiny">synthetic actors only</text>

  <rect x="1095" y="372" width="210" height="116" class="boxBack"/>
  <rect x="1095" y="372" width="210" height="116" class="external"/>
  <text x="1130" y="414" class="label">Public docs</text>
  <text x="1130" y="444" class="small">redacted evidence</text>
  <text x="1130" y="466" class="tiny">no secrets • no PII</text>

  <text x="310" y="244" class="tiny">public GETs</text>
  <text x="668" y="244" class="tiny">API reads</text>
  <text x="1018" y="244" class="tiny">state</text>
  <text x="324" y="408" class="tiny">authorized destructive</text>
  <text x="318" y="426" class="tiny">synthetic app-state only</text>
  <text x="1018" y="397" class="tiny">scrubbed</text>
  <text x="1018" y="415" class="tiny">receipts</text>

  <rect x="70" y="590" width="1260" height="78" rx="16" fill="rgba(15,23,42,0.78)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="102" cy="628" r="8" fill="#22d3ee"/>
  <text x="120" y="633" class="small">Public surface is read-oriented.</text>
  <circle cx="392" cy="628" r="8" fill="#fb7185"/>
  <text x="410" y="633" class="small">Mutations run through a private operator lane.</text>
  <circle cx="760" cy="628" r="8" fill="#a78bfa"/>
  <text x="778" y="633" class="small">Durable state lives in Postgres.</text>
  <circle cx="1048" cy="628" r="8" fill="#94a3b8"/>
  <text x="1066" y="633" class="small">Published evidence is redacted.</text>
</svg>
