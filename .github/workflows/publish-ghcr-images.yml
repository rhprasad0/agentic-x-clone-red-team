name: Publish GHCR images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
            context: .
            build_args: ""
          - image: frontend
            dockerfile: apps/frontend/Dockerfile
            context: .
            build_args: |
              VITE_API_BASE_URL=https://api.xclone.example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=xclone-${{ matrix.image }}
            org.opencontainers.image.description=Public-safe synthetic x-clone ${{ matrix.image }} image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-gitops-image-tags:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin GitOps manifests to this commit image tag
        run: |
          python3 scripts/update_gitops_image_tags.py \
            --repo-root . \
            --repository "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}"

      - name: Commit GitOps image tag update
        run: |
          if git diff --quiet -- deploy/gitops/apps/base; then
            echo "GitOps image refs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/gitops/apps/base/backend-deployment.yaml \
            deploy/gitops/apps/base/frontend-deployment.yaml
          git commit -m "ci: pin GitOps images to ${GITHUB_SHA::7} [skip ci]"
          git push
