name: Public Artifact Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Required scaffold files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f SPEC.md
          test -f THREAT_MODEL.md
          test -f RED_TEAM_HARNESS.md
          test -f docker-compose.yml
          test -f .env.example
          test -f docs/architecture.md
          test -f docs/project-scope.md
          test -f docs/resume-blurb.md
          test -f docs/red-team-scenarios.md
          test -f scripts/public_safety_scan.py
          test -f apps/backend/Dockerfile
          test -f apps/frontend/Dockerfile

      - name: Markdown tabs check
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z -- '*.md' | xargs -0 grep -n $'\t'; then
            echo "Markdown files should not contain tab characters."
            exit 1
          fi

      - name: Basic public-safety grep
        shell: bash
        run: |
          set -euo pipefail
          pattern='(/[h]ome/|/[U]sers/|AKI[A-Z0-9]{16}|s[k]-[A-Za-z0-9]{20,}|xo[x][A-Za-z]-[A-Za-z0-9-]{20,})'
          if git ls-files -z --cached --others --exclude-standard | xargs -0 grep -IEn "$pattern"; then
            echo "Potential secret, private path, or unsafe public artifact found."
            exit 1
          fi

      - name: Python public-safety scan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_safety_scan.py .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user_placeholder
          POSTGRES_PASSWORD: postgres_password_placeholder
          POSTGRES_DB: agentic_x_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user_placeholder -d agentic_x_clone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://app_user_placeholder:postgres_password_placeholder@localhost:5432/agentic_x_clone
      XCLONE_AGENT_ALEX_TOKEN: agent_alex_fixture_token_placeholder
      XCLONE_AGENT_MIRA_TOKEN: agent_mira_fixture_token_placeholder
      XCLONE_HARNESS_TOKEN: harness_fixture_token_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e "apps/backend[dev]"

      - name: Lint backend
        shell: bash
        run: ruff check apps/backend

      - name: Apply backend migrations
        shell: bash
        run: alembic -c apps/backend/alembic.ini upgrade head

      - name: Test backend
        shell: bash
        run: pytest apps/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: apps/frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  docker-public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend image
        run: docker build -t xclone-backend:ci -f apps/backend/Dockerfile .

      - name: Build frontend image
        run: docker build -t xclone-frontend:ci --build-arg VITE_API_BASE_URL=http://localhost:8000 -f apps/frontend/Dockerfile .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xclone-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xclone-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Python public-safety scan
        run: python3 scripts/public_safety_scan.py .
