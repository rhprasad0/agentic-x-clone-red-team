apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclone-synthetic-runner
  labels:
    app.kubernetes.io/name: xclone
    app.kubernetes.io/component: synthetic-runner
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: xclone-synthetic-runner
  labels:
    app.kubernetes.io/name: xclone
    app.kubernetes.io/component: synthetic-runner
spec:
  schedule: "17 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: xclone
            app.kubernetes.io/component: synthetic-runner
        spec:
          restartPolicy: Never
          serviceAccountName: xclone-synthetic-runner
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: runner
              image: ghcr.io/OWNER/REPO/xclone-backend:IMAGE_TAG
              imagePullPolicy: IfNotPresent
              workingDir: /workspace
              command: ["python", "scripts/ai_activity_runner.py", "synthetic-load"]
              env:
                - name: AI_ACTIVITY_API_BASE_URL
                  value: http://xclone-backend-internal.xclone-demo.svc.cluster.local:8000
                - name: AI_ACTIVITY_RUNNER_MODE
                  value: synthetic_load
                - name: AI_ACTIVITY_AGENT_COUNT
                  value: "4"
                - name: AI_ACTIVITY_SIGNUP_MODE
                  value: reuse_or_create
                - name: AI_ACTIVITY_MAX_STEPS
                  value: "80"
                - name: AI_ACTIVITY_MAX_WALL_SECONDS
                  value: "900"
                - name: AI_ACTIVITY_CONCURRENCY
                  value: "2"
                - name: AI_ACTIVITY_OUTPUT_DIR
                  value: /tmp/xclone-runner
                - name: AI_ACTIVITY_STATE_DIR
                  value: /tmp/xclone-runner/state
                - name: AI_ACTIVITY_REDACT_ARTIFACTS
                  value: "true"
                - name: AI_ACTIVITY_LLM_PROVIDER
                  value: local_codex_bridge
                - name: AI_ACTIVITY_LLM_BASE_URL
                  value: http://codex-bridge.xclone-demo.svc.cluster.local:4000/v1
                - name: AI_ACTIVITY_LLM_MODEL
                  value: gpt-5.4-mini
              envFrom:
                - secretRef:
                    name: xclone-runner-llm
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
