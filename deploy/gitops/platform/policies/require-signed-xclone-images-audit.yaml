apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-xclone-images-audit
  annotations:
    policies.kyverno.io/title: Require signed x-clone images (audit)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Audit-only placeholder for the x-clone signed-image gate. This intentionally
      does not enforce yet because the current published demo images are not
      Cosign-signed and are still deployed by immutable sha-* tags instead of
      digest references. Flip to Enforce only after digest signing and positive
      and negative admission smokes pass.
spec:
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 10
  background: false
  rules:
    - name: verify-xclone-ghcr-images-audit
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - xclone
      verifyImages:
        - imageReferences:
            - ghcr.io/rhprasad0/agentic-x-clone-red-team/backend*
            - ghcr.io/rhprasad0/agentic-x-clone-red-team/frontend*
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: false
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/rhprasad0/agentic-x-clone-red-team/.github/workflows/publish-ghcr-images.yml@refs/heads/main
