apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xclone-demo-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: xclone-platform-controllers
  interval: 5m
  path: ./deploy/gitops/apps/overlays/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: xclone-gitops
  timeout: 5m
  wait: true
