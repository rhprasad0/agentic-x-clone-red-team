apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xclone-platform-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/gitops/platform/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: xclone-gitops
  timeout: 5m
  wait: true
