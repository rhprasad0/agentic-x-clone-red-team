apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: xclone-image-automation-stubs
  namespace: flux-system
spec:
  dependsOn:
    - name: xclone-demo-apps
  interval: 30m
  path: ./deploy/gitops/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: xclone-gitops
  timeout: 2m
  wait: true
