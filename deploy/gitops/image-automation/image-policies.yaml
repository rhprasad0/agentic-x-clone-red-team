apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: xclone-backend
  namespace: flux-system
spec:
  image: ghcr.io/rhprasad0/agentic-x-clone-red-team/backend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: xclone-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: xclone-backend
  policy:
    semver:
      range: ">=0.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: xclone-frontend
  namespace: flux-system
spec:
  image: ghcr.io/rhprasad0/agentic-x-clone-red-team/frontend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: xclone-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: xclone-frontend
  policy:
    semver:
      range: ">=0.0.0"
