apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xclone-backend-operator-tailnet
  namespace: xclone
  labels:
    app.kubernetes.io/name: xclone-backend
    app.kubernetes.io/component: operator-tailnet
  annotations:
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - xclone-backend-operator-tailnet
  rules:
    - host: xclone-backend-operator-tailnet
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xclone-backend
                port:
                  name: http
