apiVersion: v1
kind: ConfigMap
metadata:
  name: xclone-backend-config
  namespace: xclone
data:
  APP_ENV: demo
  APP_NAME: x-clone backend
  BACKEND_CORS_ORIGINS: https://xclone.ryans-lab.click
  ENABLE_API_DOCS: "false"
  SIGNUP_MAX_DYNAMIC_AGENTS: "50"
  V2_CURSOR_DEFAULT_LIMIT: "25"
  V2_CURSOR_MAX_LIMIT: "100"
  V2_CURSOR_TTL_SECONDS: "86400"
  V2_CLIENT_REQUEST_ID_MAX_LENGTH: "120"
  V2_IDEMPOTENCY_TTL_SECONDS: "86400"
