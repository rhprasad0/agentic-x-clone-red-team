apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: xclone
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclone-backend
  namespace: xclone
# Backend AWS secret access uses the Terraform-managed EKS Pod Identity
# association bound to xclone/xclone-backend, not an IRSA annotation.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclone-frontend
  namespace: xclone
automountServiceAccountToken: false
