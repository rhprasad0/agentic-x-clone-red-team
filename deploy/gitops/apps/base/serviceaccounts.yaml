apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: xclone
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclone-backend
  namespace: xclone
# EKS Pod Identity is bound out-of-band by Terraform's
# aws_eks_pod_identity_association for xclone/xclone-backend. The backend app
# still has no Kubernetes RBAC grants.
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xclone-frontend
  namespace: xclone
automountServiceAccountToken: false
