apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: xclone-backend-runtime
  namespace: xclone
spec:
  provider: aws
  secretObjects:
    - secretName: xclone-backend-runtime
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: cursor-signing-key
          key: V2_CURSOR_SIGNING_KEY
  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: /xclone/demo/database-url
        objectType: secretsmanager
        objectAlias: database-url
      - objectName: /xclone/demo/cursor-signing-key
        objectType: secretsmanager
        objectAlias: cursor-signing-key
