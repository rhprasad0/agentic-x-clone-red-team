apiVersion: apps/v1
kind: Deployment
metadata:
  name: xclone-frontend
  namespace: xclone
  labels:
    app.kubernetes.io/name: xclone-frontend
    app.kubernetes.io/part-of: xclone-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xclone-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xclone-frontend
        app.kubernetes.io/part-of: xclone-demo
    spec:
      serviceAccountName: xclone-frontend
      containers:
        - name: frontend
          image: ghcr.io/rhprasad0/agentic-x-clone-red-team/frontend:sha-7c49659 # {"$imagepolicy": "flux-system:xclone-frontend:tag"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
