apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: x-clone-aws-secrets
  namespace: x-clone-demo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: x-clone-backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x-clone-backend-database
  namespace: x-clone-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: x-clone-aws-secrets
    kind: SecretStore
  target:
    name: x-clone-backend-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        # Terraform creates this Secrets Manager secret container. Populate the value out-of-band.
        key: x-clone-demo/postgres/app
        property: DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x-clone-migration-database
  namespace: x-clone-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: x-clone-aws-secrets
    kind: SecretStore
  target:
    name: x-clone-migration-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        # May point at the same DB with migration-capable credentials. Keep the value out of git.
        key: x-clone-demo/postgres/migrations
        property: DATABASE_URL
