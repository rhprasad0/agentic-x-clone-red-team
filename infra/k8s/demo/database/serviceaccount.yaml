apiVersion: v1
kind: ServiceAccount
metadata:
  name: x-clone-backend
  namespace: x-clone-demo
  labels:
    app.kubernetes.io/name: x-clone-backend
    app.kubernetes.io/part-of: x-clone
  annotations:
    # Replace with the Terraform/IRSA role ARN that can read only the database secrets.
    # Do not commit account IDs or real ARNs in public artifacts.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/x-clone-demo-external-secrets-read
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x-clone-migrations
  namespace: x-clone-demo
  labels:
    app.kubernetes.io/name: x-clone-migrations
    app.kubernetes.io/part-of: x-clone
