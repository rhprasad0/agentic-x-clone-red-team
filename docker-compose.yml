services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_x_clone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user_placeholder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_x_clone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user_placeholder} -d ${POSTGRES_DB:-agentic_x_clone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic_x_clone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

